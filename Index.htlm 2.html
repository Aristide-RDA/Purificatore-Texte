<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purificatore Texte - Purification & Correction Équilibrée</title>
  <style>
    :root {
      --bg-cream: #fbfbf8;
      --card-bg: rgba(255, 255, 255, 0.92);
      --green-primary: #3b6e4c;
      --green-dark: #254630;
      --green-accent: #78a883;
      --text-main: #2d3436;
      --text-muted: #636e72;
      --border-color: #e2e8f0;
      --radius: 12px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* Décoration Végétale & Bambous (SVG Zen) */
    .bamboo-bg {
      position: fixed;
      bottom: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.18;
    }

    .bamboo-left { left: 0; width: 180px; }
    .bamboo-right { right: 0; width: 220px; transform: scaleX(-1); }

    .container {
      max-width: 950px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      width: 100%;
      position: relative;
      z-index: 1;
      flex: 1;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.4rem;
      color: var(--green-primary);
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .api-key-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1rem 1.2rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .api-key-box label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--green-dark);
    }

    .api-key-box input {
      flex: 1;
      min-width: 250px;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    .api-key-box input:focus {
      border-color: var(--green-accent);
    }

    /* Tableau d'options */
    .options-table-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.2rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
    }

    .options-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--green-primary);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    .option-card {
      background: #fdfdfc;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.8rem 1rem;
    }

    .option-card h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .checkbox-item input[type="checkbox"] {
      accent-color: var(--green-primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    select {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      background-color: white;
      cursor: pointer;
    }

    /* Zone Textes */
    .editor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 768px) {
      .editor-grid {
        grid-template-columns: 1fr;
      }
    }

    .text-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
    }

    .panel-header h2 {
      font-size: 1rem;
      color: var(--green-dark);
      font-weight: 600;
    }

    textarea {
      width: 100%;
      height: 250px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.95rem;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      background: #fafafa;
      color: var(--text-main);
    }

    textarea:focus {
      border-color: var(--green-accent);
      background: #ffffff;
    }

    .actions {
      text-align: center;
      margin-bottom: 2rem;
    }

    .btn-purify {
      background: var(--green-primary);
      color: white;
      border: none;
      padding: 12px 32px;
      font-size: 1.05rem;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(59, 110, 76, 0.2);
    }

    .btn-purify:hover {
      background: var(--green-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 110, 76, 0.3);
    }

    .btn-copy {
      background: transparent;
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .btn-copy:hover {
      background: #f0f0f0;
      color: var(--text-main);
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Bambous vectoriels en arrière-plan -->
  <svg class="bamboo-bg bamboo-left" viewBox="0 0 100 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M30 0V400" stroke="#3b6e4c" stroke-width="6"/>
    <path d="M25 80H35 M25 180H35 M25 280H35 M25 380H35" stroke="#254630" stroke-width="3"/>
    <path d="M30 80C10 70 0 50 0 30M30 180C10 170 0 150 0 130M30 280C50 270 60 250 60 230" stroke="#78a883" stroke-width="3" stroke-linecap="round"/>
    <path d="M70 50V400" stroke="#3b6e4c" stroke-width="4"/>
    <path d="M66 120H74 M66 220H74 M66 320H74" stroke="#254630" stroke-width="2"/>
  </svg>

  <svg class="bamboo-bg bamboo-right" viewBox="0 0 100 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M30 0V400" stroke="#3b6e4c" stroke-width="6"/>
    <path d="M25 80H35 M25 180H35 M25 280H35 M25 380H35" stroke="#254630" stroke-width="3"/>
    <path d="M30 80C10 70 0 50 0 30M30 180C10 170 0 150 0 130M30 280C50 270 60 250 60 230" stroke="#78a883" stroke-width="3" stroke-linecap="round"/>
  </svg>

  <div class="container">
    <header>
      <h1>Purificatore Texte</h1>
      <p>Harmonisez et purifiez vos écrits en toute sérénité</p>
    </header>

    <!-- Clé API -->
    <div class="api-key-box">
      <label for="apiKey">Clé API Gemini (gratuite) :</label>
      <input type="password" id="apiKey" placeholder="Collez votre clé API Gemini ici..." />
    </div>

    <!-- Tableau de sélection des options -->
    <div class="options-table-container">
      <div class="options-title">
        🍃 Tableau de purification
      </div>
      <div class="options-grid">
        
        <!-- Options Orthographe & Grammaire -->
        <div class="option-card">
          <h3>Correction</h3>
          <div class="checkbox-group">
            <label class="checkbox-item">
              <input type="checkbox" id="optGrammar" checked> Orthographe & Grammaire
            </label>
            <label class="checkbox-item">
              <input type="checkbox" id="optFluidity" checked> Fluidité du style
            </label>
          </div>
        </div>

        <!-- Options Ponctuation -->
        <div class="option-card">
          <h3>Ponctuation</h3>
          <div class="checkbox-group">
            <label class="checkbox-item">
              <input type="checkbox" id="optPunctuation" checked> Revoir la ponctuation
            </label>
            <label class="checkbox-item">
              <input type="checkbox" id="optTypography"> Typographie propre (espaces)
            </label>
          </div>
        </div>

        <!-- Ton du texte -->
        <div class="option-card">
          <h3>Ton & Style</h3>
          <select id="optTone">
            <option value="conservation">Conserver le ton original</option>
            <option value="professionnel">Professionnel & Soigné</option>
            <option value="soutenu">Soutenu & Élégant</option>
            <option value="simplifie">Clair & Accessible</option>
          </select>
        </div>

        <!-- Traduction -->
        <div class="option-card">
          <h3>Langue / Traduction</h3>
          <select id="optLanguage">
            <option value="original">Garder la langue d'origine</option>
            <option value="fr">Français</option>
            <option value="en">Anglais</option>
            <option value="es">Espagnol</option>
            <option value="de">Allemand</option>
            <option value="it">Italien</option>
          </select>
        </div>

      </div>
    </div>

    <!-- Zone d'édition -->
    <div class="editor-grid">
      <div class="text-panel">
        <div class="panel-header">
          <h2>Texte original</h2>
        </div>
        <textarea id="inputText" placeholder="Entrez ou collez votre texte ici..."></textarea>
      </div>

      <div class="text-panel">
        <div class="panel-header">
          <h2>Texte purifié</h2>
          <button class="btn-copy" onclick="copyText()">Copier</button>
        </div>
        <textarea id="outputText" readonly placeholder="Le texte purifié apparaîtra ici..."></textarea>
      </div>
    </div>

    <div class="actions">
      <button class="btn-purify" onclick="purifyText()">Purifier le texte 🍃</button>
    </div>
  </div>

  <footer>
    Purificatore Texte &bull; Un espace de rédaction zen et serein
  </footer>

  <script>
    async function purifyText() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const inputText = document.getElementById('inputText').value.trim();
      const outputArea = document.getElementById('outputText');

      if (!apiKey) {
        alert("Veuillez entrer votre clé API Gemini.");
        return;
      }

      if (!inputText) {
        alert("Veuillez saisir un texte à corriger.");
        return;
      }

      // Récupération des options choisies dans le tableau
      const fixGrammar = document.getElementById('optGrammar').checked;
      const fixFluidity = document.getElementById('optFluidity').checked;
      const fixPunctuation = document.getElementById('optPunctuation').checked;
      const fixTypography = document.getElementById('optTypography').checked;
      const tone = document.getElementById('optTone').value;
      const language = document.getElementById('optLanguage').value;

      // Construction des instructions envoyées à l'IA
      let instructions = [];
      if (fixGrammar) instructions.push("Corrige les fautes d'orthographe, de grammaire et d'accord.");
      if (fixFluidity) instructions.push("Améliore la fluidité et la clarté du style.");
      if (fixPunctuation) instructions.push("Ajuste la ponctuation de manière naturelle.");
      if (fixTypography) instructions.push("Applique une typographie soignée (espaces incassables, guillemets adaptés).");

      if (tone !== 'conservation') {
        instructions.push(`Adopte un ton : ${tone}.`);
      }

      if (language !== 'original') {
        instructions.push(`Traduis le texte final vers la langue suivante : ${language}.`);
      }

      const prompt = `Tu es une IA spécialisée dans la purification et la correction de texte. 
Applique strictement les instructions suivantes au texte fourni sans ajouter de commentaires personnels, d'explications ou de guillemets autour de la réponse :

Instructions :
- ${instructions.join('\n- ')}

Texte original :
"""
${inputText}
"""`;

      outputArea.value = "Purification en cours...";

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          outputArea.value = data.candidates[0].content.parts[0].text.trim();
        } else {
          outputArea.value = "Une erreur est survenue lors du traitement du texte. Vérifiez votre clé API.";
        }
      } catch (error) {
        console.error(error);
        outputArea.value = "Erreur de connexion à l'API Gemini. Vérifiez votre connexion internet ou votre clé API.";
      }
    }

    function copyText() {
      const outputText = document.getElementById('outputText');
      if (outputText.value) {
        navigator.clipboard.writeText(outputText.value);
        alert("Texte copié dans le presse-papier !");
      }
    }
  </script>
</body>
</html>
